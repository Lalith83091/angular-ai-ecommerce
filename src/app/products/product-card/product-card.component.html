<article class="product-card">
  <a class="product-image" [routerLink]="['/products', product().id]" [attr.aria-label]="'View ' + product().name">
    <img
      appImageFallback
      [src]="product().image"
      [alt]="product().name"
      [attr.loading]="priority() ? 'eager' : 'lazy'"
    />
    <span class="category-tag">{{ product().category }}</span>
  </a>
  <div class="product-info">
    <div class="product-heading">
      <a class="product-name" [routerLink]="['/products', product().id]">{{ product().name }}</a>
      <span class="rating" [attr.aria-label]="product().rating + ' out of 5 stars'">
        <span aria-hidden="true">★</span> {{ product().rating.toFixed(1) }}
      </span>
    </div>
    <p class="price">{{ product().price | currency:'USD' }}</p>
    <a class="details-button" [routerLink]="['/products', product().id]">View Details</a>
  </div>
</article>
